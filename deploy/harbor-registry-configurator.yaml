# Harbor Registry Configurator DaemonSet
#
# Writes /etc/containers/registries.conf on every node with Harbor as an
# insecure registry, then sends SIGHUP to CRI-O so it picks up the change
# without a restart.
#
# Usage:
#   1. Set the harbor-registry ConfigMap's endpoint field to your Harbor
#      registry host:port (e.g. "10.8.0.1:30080").
#   2. kubectl apply -f deploy/harbor-registry-configurator.yaml
#
# NOTE: the endpoint reaches the container as an environment variable
# (configMapKeyRef), which Kubernetes resolves only when the container starts.
# Editing the ConfigMap afterwards is NOT picked up by running pods, not even by
# the hourly re-check below. After changing the endpoint run:
#   kubectl -n kube-system rollout restart daemonset/harbor-registry-configurator
#
# The container is privileged (with hostPID) so it can write the host's
# /etc/containers and signal the host's CRI-O process. It replaces the whole
# registries.conf, so any existing content of that file on the node is overwritten.
#
# To auto-discover the Harbor NodePort from within the cluster:
#   kubectl -n harbor get svc harbor -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}'
# Then set endpoint to "<control-plane-vpn-ip>:<nodeport>" (the control-plane's own
# address instead of its VPN IP when the cluster runs with disableVPN).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-registry
  namespace: kube-system
data:
  # Harbor registry endpoint — host:port reachable from all nodes (VPN IP + NodePort,
  # or the control-plane address + NodePort when the cluster runs with disableVPN).
  # Example: "10.8.0.1:30080"
  # Read once at pod start: restart the DaemonSet after changing it (see header).
  endpoint: ""
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: harbor-registry-configurator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: harbor-registry-configurator
    app.kubernetes.io/component: registry-config
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-registry-configurator
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-registry-configurator
    spec:
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists    # tolerate all taints — must run on every node
      containers:
      - name: configurator
        image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a   # pinned tag+digest; bump deliberately
        securityContext:
          privileged: true
        env:
        - name: HARBOR_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: harbor-registry
              key: endpoint
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu

          CONF=/host/etc/containers/registries.conf
          mkdir -p /host/etc/containers

          apply_config() {
            if [ -z "${HARBOR_ENDPOINT:-}" ]; then
              echo "HARBOR_ENDPOINT not set — nothing to configure"
              return
            fi

            # Build the desired registries.conf content
            DESIRED=$(printf 'unqualified-search-registries = ["docker.io"]\n\n[[registry]]\nlocation = "docker.io"\n\n[[registry]]\nprefix = "%s"\nlocation = "%s"\ninsecure = true\n' \
              "$HARBOR_ENDPOINT" "$HARBOR_ENDPOINT")

            # Only write and reload when the file has actually changed
            CURRENT=$(cat "$CONF" 2>/dev/null || true)
            if [ "$CURRENT" = "$DESIRED" ]; then
              echo "registries.conf already up to date (Harbor: ${HARBOR_ENDPOINT})"
              return
            fi

            printf '%s\n' "$DESIRED" > "$CONF"
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Updated registries.conf (Harbor: ${HARBOR_ENDPOINT})"

            # Send SIGHUP to CRI-O — it reloads registries.conf without a full restart
            for f in /proc/[0-9]*/comm; do
              [ -r "$f" ] || continue
              read -r comm < "$f" 2>/dev/null || continue
              [ "$comm" = "crio" ] || continue
              pid="${f##/proc/}"
              pid="${pid%%/*}"
              kill -HUP "$pid" 2>/dev/null \
                && echo "Sent SIGHUP to CRI-O (pid ${pid})" \
                || echo "WARN: could not signal CRI-O pid ${pid}"
              break
            done
          }

          # Apply immediately on startup, then re-check hourly and rewrite the
          # file if something on the node changed it. HARBOR_ENDPOINT is fixed
          # for the life of this pod (env is resolved at container start), so a
          # ConfigMap change needs a DaemonSet rollout restart.
          apply_config
          while sleep 3600; do
            apply_config
          done
        volumeMounts:
        - name: host-etc-containers
          mountPath: /host/etc/containers
        resources:
          requests:
            cpu: 5m
            memory: 10Mi
          limits:
            memory: 20Mi
      volumes:
      - name: host-etc-containers
        hostPath:
          path: /etc/containers
          type: DirectoryOrCreate
