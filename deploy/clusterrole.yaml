apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remote-cluster-provisioner-manager
  labels:
    app.kubernetes.io/name: remote-cluster-provisioner
rules:
  # Core: nodes (read, patch, delete for join/drain lifecycle)
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update, delete]

  # Core: secrets — kubeconfig, SSH/VPN credentials, registry auth, WireGuard keys.
  # Secrets are read through controller-runtime's cached client, which runs a
  # cluster-wide list/watch informer, so cluster-scope get/list/watch cannot be
  # narrowed to a namespace without changing the code. delete is required for
  # cleanup when a NodeProvision / RemoteCluster is removed.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]

  # No ConfigMap or Event rules are needed here. The only ConfigMap the
  # controller reads is kube-public/cluster-info (through the uncached API
  # reader, so no informer is started); that get is granted by the namespaced
  # Role in kube-public-rbac.yaml. The controller has no EventRecorder, so it
  # creates no core Events (leader-election events are covered by the
  # namespaced leader-election Role in role.yaml).

  # Batch: jobs — NodeProvision controller creates/deletes image pre-pull Jobs.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]

  # Custom: RemoteCluster (infra.dcn.ssu.ac.kr/v1)
  - apiGroups: [infra.dcn.ssu.ac.kr]
    resources: [remoteclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [infra.dcn.ssu.ac.kr]
    resources: [remoteclusters/status]
    verbs: [get, update, patch]
  - apiGroups: [infra.dcn.ssu.ac.kr]
    resources: [remoteclusters/finalizers]
    verbs: [update]

  # Custom: NodeProvision + NodeProvisionNetConfig (ml.dcn.ssu.ac.kr/v1alpha1)
  - apiGroups: [ml.dcn.ssu.ac.kr]
    resources: [nodeprovisions, nodeprovisionnetconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [ml.dcn.ssu.ac.kr]
    resources: [nodeprovisions/status, nodeprovisionnetconfigs/status]
    verbs: [get, update, patch]
  - apiGroups: [ml.dcn.ssu.ac.kr]
    resources: [nodeprovisions/finalizers, nodeprovisionnetconfigs/finalizers]
    verbs: [update]

  # Porch / Nephio — only needed when RemoteCluster GitConfig is enabled.
  # Remove these rules if you are not running Porch/Nephio on this cluster.

  # Repository objects — created and watched per RemoteCluster.
  - apiGroups: [config.porch.kpt.dev]
    resources: [repositories]
    verbs: [get, list, watch, create, update, patch, delete]

  # PackageVariant — created and updated to render platform packages.
  # NOTE: PackageVariant lives under config.porch.kpt.dev, NOT porch.kpt.dev.
  - apiGroups: [config.porch.kpt.dev]
    resources: [packagevariants]
    verbs: [get, list, watch, create, update, patch, delete]

  # Nephio infra.nephio.org (Repository + Token) — created alongside the Porch
  # Repository per cluster and deleted on RemoteCluster removal. Both kinds live
  # in the infra.nephio.org API group (the code uses infra.nephio.org/v1alpha1
  # Token; there is no token.nephio.org group).
  - apiGroups: [infra.nephio.org]
    resources: [repositories, tokens]
    verbs: [get, list, watch, create, update, patch, delete]

  # Metrics endpoint protection (--metrics-secure=true): the metrics server
  # authenticates and authorizes scrapers via TokenReview / SubjectAccessReview.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
