apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-cluster-provisioner
  namespace: remote-cluster-provisioner-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: remote-cluster-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: remote-cluster-provisioner
  strategy:
    type: Recreate  # single-replica controller; avoid two instances during rollout
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: remote-cluster-provisioner
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: remote-cluster-provisioner
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: manager
          # Placeholder image name: the real repository and tag are set through the
          # `images:` entry in kustomization.yaml (see the comment there). The
          # workflow publishes to ghcr.io/<github.repository>.
          image: ghcr.io/<ORG>/remote-cluster-provisioner
          imagePullPolicy: IfNotPresent
          command: [/manager]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8083
            - --metrics-bind-address=:8443
            - --metrics-secure=true

          ports:
            - name: healthz
              containerPort: 8083
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          env:
            # Informational: namespace of the controller pod (currently unused by the
            # manager, which derives its namespace from the in-cluster service account).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # OPTIONAL - SSH host key verification (off by default: without this
            # variable the controller accepts any SSH host key and logs a warning).
            # When set, verification FAILS CLOSED: every host the controller connects
            # to (on-prem nodes, the VPN server, control planes) must be listed in
            # the file BEFORE its resource is created, and only the key types listed
            # for a host are negotiated. An unreadable file fails every connection.
            # Create the file with `ssh-keyscan -t ed25519,ecdsa,rsa <host>` and:
            #   kubectl -n remote-cluster-provisioner-system create configmap \
            #     ssh-known-hosts --from-file=known_hosts=./known_hosts
            # then uncomment this variable plus the volume/volumeMount below.
            # - name: SSH_KNOWN_HOSTS_FILE
            #   value: /etc/ssh-known-hosts/known_hosts

          # The distroless image has no /tmp; mount one for scratch space if needed.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # - name: ssh-known-hosts        # see SSH_KNOWN_HOSTS_FILE above
            #   mountPath: /etc/ssh-known-hosts
            #   readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        # - name: ssh-known-hosts        # see SSH_KNOWN_HOSTS_FILE above
        #   configMap:
        #     name: ssh-known-hosts

      # Keep the controller on control-plane nodes by preference, but allow any node.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
