<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RemoteCluster phase flow: a new resource starts Provisioning, moves to Ready on success or Failed on error; Failed retries up to 5 times before requiring manual attention; a Ready cluster receives routine upkeep and is cleaned up on deletion.">
  <defs>
    <marker id="rcArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <circle cx="40" cy="195" r="6" fill="#1a1a1a"/>
  <path d="M46,195 L70,195" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>

  <rect x="70" y="160" width="200" height="70" rx="10" fill="#1a1a1a" fill-opacity="0.09" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">Provisioning</text>
  <text x="170" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">(install running)</text>

  <rect x="430" y="160" width="200" height="70" rx="10" fill="#1a1a1a" fill-opacity="0.09" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="530" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">Ready</text>
  <text x="530" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">(cluster usable)</text>

  <path d="M480,160 C480,105 580,105 580,160" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>
  <text x="530" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">routine upkeep (token refresh,</text>
  <text x="530" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">config sync, platform deploy)</text>

  <path d="M270,195 L430,195" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>
  <text x="350" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">install succeeds</text>

  <rect x="740" y="160" width="220" height="70" rx="10" fill="#1a1a1a" fill-opacity="0.06" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="850" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">Node cleaned up</text>
  <text x="850" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">&amp; removed from VPN</text>
  <path d="M630,195 L740,195" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>
  <text x="685" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">you delete the resource</text>

  <rect x="70" y="320" width="200" height="70" rx="10" fill="#1a1a1a" fill-opacity="0.09" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">Failed</text>
  <text x="170" y="367" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">(see status.message)</text>

  <path d="M130,230 L130,320" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>
  <text x="20" y="278" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1a1a1a">install</text>
  <text x="20" y="292" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1a1a1a">fails</text>

  <path d="M210,320 L210,230" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>
  <text x="285" y="270" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1a1a1a">retry, up to</text>
  <text x="285" y="284" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1a1a1a">5 attempts</text>

  <path d="M130,390 L130,422" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#rcArrow)"/>
  <circle cx="130" cy="434" r="8" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="130" cy="434" r="3.5" fill="#1a1a1a"/>
  <text x="160" y="438" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1a1a1a">retry limit reached — needs your attention</text>
</svg>
