name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate: nothing is pushed to GHCR (including `latest`) unless the code builds,
  # vets and passes the unit tests that do not need envtest/kind. The controller
  # (internal/...) tests need envtest binaries and run in test.yml instead.
  test:
    name: Build, vet and unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.gover.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go.mod is the single source of truth for the Go version. The gate above
      # (setup-go with go-version-file) and the image (Dockerfile GO_VERSION
      # build arg, passed below) must use the same toolchain. Fail early if the
      # Dockerfile default (which carries the matching digest pin) has drifted.
      - name: Resolve Go version from go.mod
        id: gover
        run: |
          v="$(sed -n 's/^toolchain go\([0-9][0-9.]*\)$/\1/p' go.mod | head -n1)"
          if [ -z "$v" ]; then
            v="$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod | head -n1)"
          fi
          if [ -z "$v" ]; then
            echo "::error::could not determine the Go version from go.mod"
            exit 1
          fi
          d="$(sed -n 's/^ARG GO_VERSION=\(.*\)$/\1/p' Dockerfile | head -n1)"
          if [ "$v" != "$d" ]; then
            echo "::error::go.mod uses Go $v but Dockerfile ARG GO_VERSION is '$d'; update GO_VERSION and GO_IMAGE_DIGEST in the Dockerfile"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./api/... ./pkg/... ./provider/...

  # Build each platform natively on its own runner instead of cross-building
  # linux/arm64 under QEMU emulation on an amd64 runner — QEMU-emulated
  # compilation is commonly 10-20x slower than native and, combined with the
  # garble build step (opt-in, see the OBFUSCATE build arg below), which
  # recompiles the whole dependency tree from source on every build, was the
  # main driver of multi-hour build times.
  # Each job pushes its image by digest only; the merge job below assembles
  # the final multi-arch manifest list and applies the real tags.
  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform pair for cache scoping and artifact naming
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Obfuscation is opt-in: set the repository variable OBFUSCATE=true
          # (Settings > Secrets and variables > Actions > Variables) after
          # verifying an obfuscated image works. Default is a plain build.
          build-args: |
            GO_VERSION=${{ needs.test.outputs.go-version }}
            OBFUSCATE=${{ vars.OBFUSCATE || 'false' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform images built above into a single multi-arch
  # manifest list and pushes it under the real tags (latest, semver, etc).
  merge:
    name: Merge manifest and push tags
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch → latest + main-<sha>
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            # semver tags (v1.2.3) → 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
