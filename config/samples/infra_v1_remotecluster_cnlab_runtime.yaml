# ============================================================
# RemoteCluster — GPU worker node
#
# Joins the cluster provisioned by ml-cluster-cp above.
# clusterName must match the control-plane's clusterName.
# The cnlabRuntime section is independent per node — set a
# different version here to upgrade workers individually.
# ============================================================
apiVersion: infra.dcn.ssu.ac.kr/v1
kind: RemoteCluster
metadata:
  name: ml-cluster-gpu-worker-01
  namespace: default
  labels:
    app.kubernetes.io/name: remote-cluster-provisioner
    app.kubernetes.io/managed-by: kustomize
spec:
  # Must match the control-plane's clusterName for worker adoption.
  clusterName: "ml-cluster"

  host: "10.9.0.14"
  port: "22"
  user: "ubuntu"

  vpnConfig:
    ip: "10.9.0.14"

  nodeInfo:
    nodeType: "worker"
    hardwareType: "gpu"

  auth:
    sshPrivateKeySecretRef:
      name: gpu-worker-ssh-secret
      key: password
---
# SSH credential for the GPU worker node.
apiVersion: v1
kind: Secret
metadata:
  name: gpu-worker-ssh-secret
  namespace: default
type: Opaque
stringData:
  password: "1"

