# ============================================================
# cnlab-runtime registry credentials
#
# The controller reads "username" and "token" from this secret
# when pulling the cnlab-runtime OCI artifact from GHCR during
# control-plane init and worker node join.
#
# Referenced by RemoteCluster.spec.nodeInfo.softwareConfig
#   .cnlabRuntime.credentialsRef
# ============================================================
# apiVersion: v1
# kind: Secret
# metadata:
#   name: cnlab-runtime-registry
#   namespace: default
# type: Opaque
# stringData:
#   username: "your-github-username"
#   token: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # packages:read scope minimum

---
# ============================================================
# RemoteCluster — control-plane node
#
# Bootstraps a new Kubernetes cluster on the target host and
# installs cnlab-runtime (CRI-O + CRIU + runc) from the
# prebuilt OCI artifact before kubeadm init.
# ============================================================
apiVersion: infra.dcn.ssu.ac.kr/v1
kind: RemoteCluster
metadata:
  name: ml-cluster-cp
  namespace: default
  labels:
    app.kubernetes.io/name: remote-cluster-provisioner
    app.kubernetes.io/managed-by: kustomize
spec:
  # Unique identifier for this cluster.  Worker RemoteClusters must set
  # clusterName to this value to be adopted by the control plane.
  clusterName: "ml-cluster"

  # SSH access to the control-plane node.
  host: "192.168.3.234"
  port: "22"
  user: "ubuntu"

  vpnConfig:
    ip: "10.9.0.13"
    vpnServerPublicIP: "13.215.206.108"
    vpnServerSSHPort: "22"
    vpnServerSSHUsername: ubuntu
    vpnSshCredentialsRef:
      name: vpn-server-ssh-secret
      namespace: default
      key: id_rsa

  nodeInfo:
    nodeType: "control-plane"
    hardwareType: "cpu"
    softwareConfig:
      kubernetesVersion: "v1.35.0"
      imagePrepulls:
        - image: "docker.io/vitu1/kernel-pytorch-gpu:3.2.3-cu121"
          nodeTarget: "gpu"  # gpu or all download on all nodes
        - image: "docker.io/vitu1/kernel-tf-gpu:3.2.3-cu121"
          nodeTarget: "gpu"
        - image: "docker.io/vitu1/kernel-pytorch-gpu-vscode:3.2.3-cu121"
          nodeTarget: "gpu"
        - image: "docker.io/vitu1/kernel-tf-gpu-vscode:3.2.3-cu121"
          nodeTarget: "gpu"
      imagePullSecretRef:
        name: dockerhub-creds

      # cnlabRuntime configures the prebuilt CRI-O runtime OCI artifact.
      # All fields are optional; the defaults listed here are shown for clarity.
      cnlabRuntime:
        # OCI registry host. Default: ghcr.io
        registry: "ghcr.io"
        # Image repository path. Default: vitu-mafeni/cnlab-runtime
        repository: "vitu-mafeni/cnlab-runtime"
        # Artifact version tag. Default: 1.0.0-beta
        version: "1.0.0-beta"
        # ORAS CLI version used to pull the artifact. Default: 1.3.2
        orasVersion: "1.3.2"
        # Secret containing "username" and "token" for registry auth.
        # Follows the same pattern as vpnSshCredentialsRef.
        # Leave name empty to pull from a public registry without auth.
        # credentialsRef:
        #   name: cnlab-runtime-registry
        #   namespace: default

      # platformVariables are injected into the ml-platform-deploy PackageVariant
      # as packageContext and rendered into every manifest via apply-setters.
      #
      # Network locations (JUPYTERHUB_PUBLIC_URL, NEXT_PUBLIC_KC_URL,
      # NEXT_PUBLIC_QUOTA_API, EG_KERNELSPECS_NFS_SERVER) are auto-computed
      # from spec.host — only add them here to override the defaults.
      #
      # In-cluster service URLs (GRAFANA_URL, ALERTMANAGER_URL, PROMETHEUS_URL,
      # HARBOR_BASE_URL, CHECKPOINT_API_URL) also have working defaults —
      # override only when using external instances.
      #
      # Generation commands:
      #   JUPYTERHUB_API_TOKEN / QUOTA_API_TOKEN:  openssl rand -hex 32
      #   KEYCLOAK_ADMIN_PASSWORD / DB_PASSWORD:   openssl rand -base64 24
      #   CREDENTIAL_KEY: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      #   GHCR_DOCKERCONFIGJSON:
      #     kubectl create secret docker-registry ghcr-pull-secret \
      #       --docker-server=ghcr.io --docker-username=<user> --docker-password=<token> \
      #       --namespace=jhub-ns --dry-run=client \
      #       -o jsonpath="{.data.\.dockerconfigjson}" | base64 -d
      platformVariables:
        # ── Credentials (required — no safe default is possible) ──────────────
        - key: KEYCLOAK_ADMIN_PASSWORD
          value: "CHANGE_ME"
        - key: JUPYTERHUB_API_TOKEN        # must match hub.services.quota-api.apiToken in jhub-values.yaml
          value: "CHANGE_ME"
        - key: QUOTA_API_TOKEN             # must match hub.extraEnv.QUOTA_API_TOKEN — different from above
          value: "CHANGE_ME"
        - key: DB_PASSWORD
          value: "CHANGE_ME"
        - key: CREDENTIAL_KEY              # Fernet key — generate once, never rotate without migrating data
          value: "CHANGE_ME"
        - key: GHCR_DOCKERCONFIGJSON       # raw JSON (not base64) — see generation command above
          value: "CHANGE_ME"

        # ── Image tags (required — whatever you built and pushed to GHCR) ──────
        - key: QUOTA_API_IMAGE
          value: "ghcr.io/CHANGE_ME/quota-api:latest"
        - key: FRONTEND_IMAGE
          value: "ghcr.io/CHANGE_ME/ml-platform-frontend:latest"

        # ── Network overrides (optional — auto-computed from spec.host) ────────
        # - key: JUPYTERHUB_PUBLIC_URL
        #   value: "http://192.168.3.234:30080"
        # - key: NEXT_PUBLIC_KC_URL
        #   value: "http://192.168.3.234:30090"
        # - key: NEXT_PUBLIC_QUOTA_API
        #   value: "http://192.168.3.234:30082"
        # - key: EG_KERNELSPECS_NFS_SERVER
        #   value: "192.168.3.234"

        # ── Storage (optional — required only for model saving / vLLM serving) ─
        # - key: MODEL_ARTIFACT_STORAGE_CLASS
        #   value: "nfs-rwx"

        # ── External Postgres (optional — leave unset to use bundled StatefulSet)
        # - key: DB_HOST
        #   value: "postgres.internal"
        # - key: DB_PORT
        #   value: "5432"

        # ── External monitoring (optional — in-cluster defaults apply otherwise)
        # - key: GRAFANA_URL
        #   value: "http://grafana.yourdomain.com"
        # - key: ALERTMANAGER_URL
        #   value: "http://alertmanager.yourdomain.com"
        # - key: PROMETHEUS_URL
        #   value: "http://prometheus.yourdomain.com"
        # - key: HARBOR_BASE_URL
        #   value: "http://harbor.yourdomain.com"
        # - key: CHECKPOINT_API_URL
        #   value: "http://checkpoint-api.yourdomain.com"

        # ── Idle GPU reclamation (optional — default is admin-UI / DB managed) ─
        # Uncomment RECLAMATION_POLICY_SOURCE first to switch to env-driven policy.
        # The remaining keys only take effect when policy source is "env".
        # - key: RECLAMATION_POLICY_SOURCE
        #   value: "env"
        # - key: RECLAMATION_ENABLED
        #   value: "true"
        # - key: RECLAMATION_GPU_UTIL_PCT      # reclaim if GPU util below this % for WINDOW minutes
        #   value: "10.0"
        # - key: RECLAMATION_WINDOW_MINUTES    # idle window before reclamation triggers
        #   value: "30"
        # - key: RECLAMATION_GRACE_MINUTES     # grace period given to the user before forced stop
        #   value: "15"
        # - key: RECLAMATION_WARNING_MINUTES   # how early to warn the user before grace starts
        #   value: "30"
        # - key: RECLAMATION_REQUIRE_CPU_IDLE  # also require CPU idle before reclaiming
        #   value: "false"
        # - key: RECLAMATION_REQUIRE_GPU_IDLE  # also require GPU memory idle before reclaiming
        #   value: "false"

  auth:
    sshPrivateKeySecretRef:
      name: cp-node-ssh-secret
      key: password

  gitConfig:
    enable: "true"
    gitServer: "http://192.168.3.182:31810"
    gitUsername: "nephio"
    upstreamPlatformRepo: "catalog-workloads-mlplatform"
    packageRevision: "v1.0.0"

---
---
# SSH credential for the control-plane node.
apiVersion: v1
kind: Secret
metadata:
  name: cp-node-ssh-secret
  namespace: default
type: Opaque
stringData:
  password: "1"

---
# VPN server SSH credential (used to register WireGuard peers).
apiVersion: v1
kind: Secret
metadata:
  name: vpn-server-ssh-secret
  namespace: default
type: Opaque
stringData:
  id_rsa: |
    -----BEGIN RSA PRIVATE KEY-----
   EXAMMPLE PRIVATE KEY CONTENT
    -----END RSA PRIVATE KEY-----

---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-creds
  namespace: default
type: Opaque
stringData:
  username: vitu1
  password: EXAMPLE_DOCKERHUB_PASSWORD
---
# ============================================================
# RemoteCluster — GPU worker node
#
# Joins the cluster provisioned by ml-cluster-cp above.
# clusterName must match the control-plane's clusterName.
# The cnlabRuntime section is independent per node — set a
# different version here to upgrade workers individually.
# ============================================================
apiVersion: infra.dcn.ssu.ac.kr/v1
kind: RemoteCluster
metadata:
  name: ml-cluster-gpu-worker-01
  namespace: default
  labels:
    app.kubernetes.io/name: remote-cluster-provisioner
    app.kubernetes.io/managed-by: kustomize
spec:
  # Must match the control-plane's clusterName for worker adoption.
  clusterName: "ml-cluster"

  host: "10.9.0.14"
  port: "22"
  user: "ubuntu"

  vpnConfig:
    ip: "10.9.0.14"

  nodeInfo:
    nodeType: "worker"
    hardwareType: "gpu"

  auth:
    sshPrivateKeySecretRef:
      name: gpu-worker-ssh-secret
      key: password
---
# SSH credential for the GPU worker node.
apiVersion: v1
kind: Secret
metadata:
  name: gpu-worker-ssh-secret
  namespace: default
type: Opaque
stringData:
  password: "1"

---