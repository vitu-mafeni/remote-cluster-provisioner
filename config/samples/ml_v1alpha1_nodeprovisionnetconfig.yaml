apiVersion: ml.dcn.ssu.ac.kr/v1alpha1
kind: NodeProvisionNetConfig
metadata:
  labels:
    app.kubernetes.io/name: remote-cluster-provisioner
    app.kubernetes.io/managed-by: kustomize
  name: nodeprovisionnetconfig-sample
spec:
  # Minimal hand-authored example (normally created by the management cluster
  # controller). For a cluster without WireGuard, set disableVPN and drop
  # vpnRange / vpnServerPublicConfig.
  clusterName: my-cluster
  disableVPN: true
  softwareConfig:
    kubernetesVersion: "v1.34.2"
    # Registries served over plain HTTP / with an untrusted cert (host or host:port).
    # Written as CRI-O registries.conf.d drop-ins on every provisioned node. Hosts
    # of the imagePrepulls images are ALSO marked insecure (backward compatible).
    # insecureRegistries:
    #   - harbor.example.com:30002
