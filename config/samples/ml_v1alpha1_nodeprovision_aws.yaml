---
# AWS credentials secret — use awsAccessKeyId/awsSecretAccessKey for static creds,
# or omit both and rely on an IAM instance profile on the controller pod.
apiVersion: v1
kind: Secret
metadata:
  name: aws-node-credentials
  namespace: default
type: Opaque
stringData:
  # Optional: omit these keys to use the controller's IAM role instead.
  awsAccessKeyId: "AKIAIOSFODNN7EXAMPLE"
  awsSecretAccessKey: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
---
# Minimal spec: only region + nodeLabel are required.
# The controller resolves instanceType, AMI, VPC, subnet, and security group automatically.
apiVersion: ml.dcn.ssu.ac.kr/v1alpha1
kind: NodeProvision
metadata:
  name: aws-node-001
  namespace: default
spec:
  provider: AWS
  clusterName: my-cluster   # selects the NodeProvisionNetConfig whose spec.clusterName matches (required when the namespace has several clusters)
  role: worker
  nodeLabel: cpu          # "cpu" → t3.xlarge  |  "gpu" → p3.2xlarge
  region: ap-northeast-2  # AMI + network resolved per-region automatically
  # instanceType: p3.2xlarge # If spec.instanceType is set, resolveAWSDefaults skips the DefaultInstanceTypeForLabel lookup and uses your value directly.
  credentialsRef:
    name: aws-node-credentials
    namespace: default
  # awsConfig is optional — all fields below are auto-populated when absent.
  # Uncomment to override any individual value:
  # awsConfig:
  #   ami: ami-0c9c942bd7bf113a2   # a custom/private/shared Ubuntu 20.04+ AMI in spec.region
  #   # ...or pick the newest AMI by name (resolved once, recorded in ami):
  #   # amiName: "my-k8s-node-*"
  #   # amiOwners: [self]            # self (default) | amazon | aws-marketplace | <12-digit account>
  #   # ...and/or boot the root volume from an EBS snapshot (same region, completed):
  #   # rootSnapshotId: snap-0123456789abcdef0
  #   # rootVolumeSizeGB: 100        # must be >= the snapshot/AMI root size
  #   # Launch into an existing VPC/subnet instead of the region's default VPC.
  #   # Set any of vpcId / subnetId / securityGroupIds: the VPC is derived from
  #   # whichever is given (subnet first), everything must agree and exist in
  #   # spec.region, and a subnet is picked from the VPC when none is set.
  #   vpcId: vpc-0123456789abcdef0
  #   subnetId: subnet-0123456789abcdef0
  #   securityGroupIds:           # must be in the subnet's VPC; never modified by the controller
  #     - sg-0123456789abcdef0
  #   disablePublicIp: true       # private subnet: no public IP (needs NAT/egress)
  #   # Cluster without a VPN: the node's VPC must contain the control plane's private
  #   # API endpoint (checked before anything is created). Set only when it is
  #   # reachable by VPC peering / transit gateway instead:
  #   skipControlPlaneVpcCheck: true
  #   keyPairName: my-keypair
  #   iamInstanceProfile: my-profile
  #   tags:
  #     environment: production
