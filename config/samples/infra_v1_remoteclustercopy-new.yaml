apiVersion: infra.dcn.ssu.ac.kr/v1
kind: RemoteCluster
metadata:
  name: remotecluster-sample
  namespace: default
  labels:
    app.kubernetes.io/name: remote-cluster-provisioner
    app.kubernetes.io/managed-by: kustomize

spec:
  # This must be unique for each cluster.
  # Used as:
  # 1. Kubernetes cluster name during provisioning
  # 2. Parent cluster name when adding worker nodes
  clusterName: "remotecluster-new"

  # Target node SSH information
  host: "192.168.3.234"
  port: 22
  user: "ubuntu"

  # Node information
  nodeInfo:
    # control-plane or worker
    nodeType: "control-plane"

    # cpu or gpu
    hardwareType: "cpu"

    softwareConfig:
      # GPU-related fields are optional.
      # Only required when hardwareType=gpu

      # nvidiaDriverVersion: "580" #nvidia driver version for gpu node, e.g. 535.104.05
      # nvidiaContainerToolkitVersion: "1.19.0-1" #nvidia container toolkit version for gpu node
      # k8sDevicePluginVersion: "v0.17.1"
      kubernetesVersion: "v1.35.0"
      imagePrepulls:
        - "docker.io/vitu1/kernel-pytorch-gpu:3.2.3-cu121"
        - "docker.io/vitu1/kernel-tf-gpu:3.2.3-cu121"
      imagePullSecretRef:
        name: dockerhub-creds

  # VPN configuration
  vpnConfig:
    # VPN IP assigned to this node
    ip: "10.9.0.13"

    # Public IP of VPN server
    vpnServerPublicIP: "13.215.206.108"

    vpnSshCredentialsRef:
      name: "vpn-server-secret"
      namespace: "default"
      key: "id_rsa"

  # SSH authentication
  auth:
    sshPrivateKeySecretRef:
      name: "remote-cluster-new-secret"
      key: "password"

  # GitOps configuration
  gitConfig:
    # "true" or "false"
    enable: "true"

    # Git server URL
    gitServer: "http://192.168.3.99:31810"

    # Git username
    gitUsername: "nephio"

    # Upstream platform repository
    upstreamPlatformRepo: "catalog-workloads-mlplatform"

    # Branch/tag/commit
    packageRevision: "v1.0.0"

---
apiVersion: v1
kind: Secret
metadata:
  name: remote-cluster-new-secret
  namespace: default
type: Opaque
stringData:
  password: "1"

---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: vpn-server-secret
#   namespace: default
# type: Opaque
# stringData:
#   password: "vpn-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: vpn-server-secret
  namespace: default
type: Opaque
stringData:
  id_rsa: |
    -----BEGIN RSA PRIVATE KEY-----
CHANGE ME
    -----END RSA PRIVATE KEY-----
---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-creds
  namespace: default
type: Opaque
stringData:
  username: vitu1
  password: CHANGE ME
---
# AWS credentials secret — two supported modes:
#
# Mode 1: Static IAM credentials only
#   Provide awsAccessKeyId and awsSecretAccessKey.
#   The long-lived key pair is used directly for all AWS API calls.
#
# Mode 2: MFA-backed STS session (static credentials + MFA fields)
#   Add mfaSerialNumber and mfaTotpSecret to enable automatic
#   sts:GetSessionToken refresh. The controller generates TOTP codes and
#   caches the resulting session token (awsSessionToken / awsSessionExpiry)
#   in this secret, refreshing it automatically before it expires.
#
# ── How to obtain mfaTotpSecret ─────────────────────────────────────────────
#
#   mfaTotpSecret is the base32 seed AWS shows ONCE when you register a
#   virtual MFA device. Retrieve it as follows:
#
#   New device:
#     1. IAM → Users → <your user> → Security credentials → Assign MFA device
#     2. Choose "Authenticator app" and click Next
#     3. Click "Show QR code", then "show secret key" below the QR image
#     4. Copy that key — this is your mfaTotpSecret
#     5. Also scan the QR code with your authenticator app as normal
#
#   Already-registered device:
#     AWS does not expose the seed after setup. Options:
#     - Check your authenticator app: Authy, 1Password, and Bitwarden can
#       export/display the secret. Google Authenticator cannot.
#     - Deregister the device in IAM and re-register it, saving the secret
#       key when it is displayed.
#
#   Hardware MFA keys (YubiKey, etc.) do not expose their TOTP seed and are
#   not compatible with mfaTotpSecret. Use a virtual authenticator app.
#
#   Verify the secret generates correct codes (output should match your app):
#     oathtool --totp --base32 <mfaTotpSecret>
#
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: default
type: Opaque
stringData:
  # ── Required for both modes ──────────────────────────────────────────────
  awsAccessKeyId: "CHANGE ME"
  awsSecretAccessKey: "CHANGE ME"

  # ── MFA session mode (remove these two lines to use static mode only) ────
  # ARN of the already-registered MFA device in AWS IAM.
  mfaSerialNumber: "arn:aws:iam::123456789012:mfa/mydevice"
  # Base32 TOTP seed — see "How to obtain mfaTotpSecret" above.
  mfaTotpSecret: "CHANGE ME"

  # ── Optional ─────────────────────────────────────────────────────────────
  # Session token lifetime in seconds (900–129600). Default: 43200 (12 h).
  # mfaDurationSeconds: "43200"

  # The following fields are written automatically by the controller
  # after each successful sts:GetSessionToken call. Do not set manually.
  # awsSessionToken: ""
  # awsSessionExpiry: ""